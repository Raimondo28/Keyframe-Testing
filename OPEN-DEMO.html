function checkBounds(bounds) {
  if (!bounds || !['west','east','south','north'].every(k=>Number.isFinite(bounds[k])) ||
      bounds.west >= bounds.east || bounds.south >= bounds.north ||
      bounds.south <= -85.051129 || bounds.north >= 85.051129) {
    throw new RangeError('Use finite longitude/latitude bounds within the Web Mercator latitude limits.');
  }
}

const mercatorX = longitude => RADIUS * longitude * Math.PI / 180;
const mercatorY = latitude => RADIUS * Math.log(Math.tan(Math.PI/4 + latitude*Math.PI/360));

function lonLatToPoint(lonLat, bounds=WESTPORT_BOUNDS) {
  checkBounds(bounds);
  if (!Array.isArray(lonLat) || lonLat.length !== 2 || !lonLat.every(Number.isFinite) || Math.abs(lonLat[1]) >= 85.051129) {
    throw new RangeError('Use a finite [longitude, latitude] coordinate within Web Mercator latitude limits.');
  }
  const west=mercatorX(bounds.west), east=mercatorX(bounds.east);
  const south=mercatorY(bounds.south), north=mercatorY(bounds.north);
  return [(mercatorX(lonLat[0])-west)/(east-west)*WIDTH, (north-mercatorY(lonLat[1]))/(north-south)*HEIGHT];
}

function pointToLonLat(point, bounds=WESTPORT_BOUNDS) {
  checkBounds(bounds);
  if (!Array.isArray(point) || point.length !== 2 || !point.every(Number.isFinite)) {
    throw new RangeError('Use a finite [x, y] canvas coordinate.');
  }
  const west=mercatorX(bounds.west), east=mercatorX(bounds.east);
  const south=mercatorY(bounds.south), north=mercatorY(bounds.north);
  const x=west+point[0]/WIDTH*(east-west), y=north-point[1]/HEIGHT*(north-south);
  return [x/RADIUS*180/Math.PI, (2*Math.atan(Math.exp(y/RADIUS))-Math.PI/2)*180/Math.PI];
}

function dateAt(offset, start) {

function dayOffset(value, start) {

function programmeRange(activities=[], options={}) {

  if (options.end) ends.push(options.end);

}

function timelineTicks(range, count=5) {
  if (!range || !validDate(range.start) || !validDate(range.end) || range.start > range.end) throw new RangeError('Use an ordered programme range.');

  const target=Math.max(2,Math.min(12,Math.trunc(count)||5));
  const ticks=new Set([range.start,range.end]);
  if (spanDays > 730) {
    const roughYears=spanDays/365.2425/(target-1);
    const interval=[1,2,3,5,10,20,25,50,100].find(n=>n>=roughYears) || Math.ceil(roughYears/100)*100;
    const firstYear=Number(range.start.slice(0,4));
    for(let year=Math.ceil(firstYear/interval)*interval;year<=Number(range.end.slice(0,4));year+=interval) {
      const value=`${String(year).padStart(4,'0')}-01-01`;
      if(value>range.start && value<range.end) ticks.add(value);
    }
  } else if (spanDays > 90) {
    const roughMonths=spanDays/30.4375/(target-1);
    const interval=[1,3,6,12].find(n=>n>=roughMonths) || 12;
    const firstMonth=Number(range.start.slice(0,4))*12+Number(range.start.slice(5,7))-1;
    const lastMonth=Number(range.end.slice(0,4))*12+Number(range.end.slice(5,7))-1;
    for(let month=Math.ceil(firstMonth/interval)*interval;month<=lastMonth;month+=interval) {
      const value=`${String(Math.floor(month/12)).padStart(4,'0')}-${String(month%12+1).padStart(2,'0')}-01`;
      if(value>range.start && value<range.end) ticks.add(value);
    }
  } else {
    const roughDays=(spanDays-1)/(target-1);
    const interval=[1,2,7,14,30].find(n=>n>=roughDays) || 30;
    for(let offset=interval;offset<spanDays-1;offset+=interval) ticks.add(dateAt(offset,range.start));
  }
  return [...ticks].sort();
}

 const sources=scenario.sources?.length?scenario.sources:defaultSources;
 modal(`<div class="modal-eyebrow">PROJECT BASIS & SOURCES</div><h2>${esc(scenario.label)} concept</h2><p>${esc(scenario.disclaimer||'Sample project data for demonstration only.')}</p><div class="basis-grid"><div><strong>Area boundaries</strong><p>Illustrative coordination envelopes, not surveyed boundaries or approved work packages.</p></div><div><strong>Activity dates</strong><p>Day-level dates are editable scenario assumptions. Public year-level milestones do not establish construction activity dates.</p></div></div>${scenario.milestones?.length?`<h3>Programme reference points</h3><ul class="source-list">${scenario.milestones.map(m=>`<li><strong>${esc(m.label||m.title)}</strong><span>${esc(m.date||m.period||'')} · ${esc(m.basis||m.status||'Scenario assumption')}</span></li>`).join('')}</ul>`:''}<h3>References</h3><ul class="source-list">${sources.map(s=>`<li><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.title)} ↗</a><span>${esc(s.status||s.publisher||'Reference')}${s.published_date?' · '+esc(s.published_date):''}</span>${s.quote?`<p>${esc(s.quote)}</p>`:''}</li>`).join('')}</ul>${scenario.map.type==='satellite'?`<h3>Satellite imagery</h3><p><a href="https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer" target="_blank" rel="noopener noreferrer">Esri World Imagery service ↗</a><br>Provider attribution: ${esc(scenario.map.attribution)}. Acquisition dates vary by location; this is not a live image. Image extent and polygon coordinates use the same Web Mercator projection (EPSG:3857).${scenario.map.imagePath?' A cached image is bundled with this demo, retrieved '+esc(scenario.map.retrievedAt)+'.':' An internet connection and access to the imagery service are required.'}</p>`:''}<div class="modal-actions"><button data-close class="primary">Back to workspace</button></div>`);
}
async function loadWorkspace(e){
 try{const file=e.target.files[0];if(!file)return;if(file.size>5e6)throw Error('Workspace too large.');const v=JSON.parse(await file.text());if(v.format!=='keyframe-concept-workspace'||v.version!==1||!Array.isArray(v.footprints)||!v.footprints.length||v.footprints.length>100)throw Error('Choose an exported demo workspace.');if(v.scenarioId&&!SCENARIOS[v.scenarioId])throw Error('Unknown project example in workspace.');const target=getScenario(v.scenarioId||(v.footprints.some(f=>f.id.startsWith('WP-'))?'westport':'brisbane'));
 const ids=new Set();for(const f of v.footprints){if(typeof f.id!=='string'||!/^[A-Za-z0-9_-]+$/.test(f.id)||ids.has(f.id)||typeof f.name!=='string'||!/^#[0-9a-f]{6}$/i.test(f.color)||!validPolygon(f.points))throw Error('Invalid footprint in workspace.');ids.add(f.id);}
 if(v.map?.bounds&&JSON.stringify(v.map.bounds)!==JSON.stringify(target.map.bounds))throw Error('Workspace map extent differs from this example.');
 const activities=validateRows(v.activities.map(a=>({activity_id:a.id,name:a.name,start:a.start,finish:a.finish,footprint_id:a.footprint})),v.footprints);save();stopPlayback();scenario=target;scenarioId=target.id;model={scenarioId,footprints:v.footprints,activities,source:typeof v.source==='string'?v.source:target.programmeName};selected=model.footprints[0].id;cursor=target.defaultCursor;save();render();toast('Workspace restored.');
 }catch(err){toast(err.message);}
}
render();
