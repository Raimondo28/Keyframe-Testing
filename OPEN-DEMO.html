<script>
const DAY=86400000;
const date=n=>new Date(Date.UTC(2027,1,1)+n*DAY).toISOString().slice(0,10);
const day=s=>(Date.parse(s+'T00:00:00Z')-Date.UTC(2027,1,1))/DAY;
const seed=()=>({footprints:[
 {id:'FP-001',name:'Domestic apron works',color:'#e89c39',points:[[340,245],[540,245],[565,355],[360,375]]},
 {id:'FP-002',name:'Taxiway service corridor',color:'#7771d9',points:[[475,315],[680,300],[705,380],[490,405]]},
 {id:'FP-003',name:'Terminal forecourt',color:'#459d9d',points:[[325,430],[480,415],[510,485],[350,510]]},
 {id:'FP-004',name:'Northern drainage upgrade',color:'#5c8bce',points:[[650,120],[775,135],[755,235],[630,215]]}
],activities:[
 {id:'BAC-101',name:'Apron pavement rehabilitation',footprint:'FP-001',start:'2027-02-04',finish:'2027-02-19'},
 {id:'BAC-204',name:'Service corridor installation',footprint:'FP-002',start:'2027-02-12',finish:'2027-02-25'},
 {id:'BAC-310',name:'Forecourt enabling works',footprint:'FP-003',start:'2027-02-07',finish:'2027-02-23'},
 {id:'BAC-402',name:'Drainage & civil works',footprint:'FP-004',start:'2027-02-18',finish:'2027-03-04'}
]});
const cross=(a,b,c)=>(b[0]-a[0])*(c[1]-a[1])-(b[1]-a[1])*(c[0]-a[0]);
const area=p=>Math.abs(p.reduce((s,a,i)=>{const b=p[(i+1)%p.length];return s+a[0]*b[1]-b[0]*a[1]},0)/2);
const signed=p=>p.reduce((s,a,i)=>{const b=p[(i+1)%p.length];return s+a[0]*b[1]-b[0]*a[1]},0);
function triangles(poly){
 const p=poly.map(a=>[...a]);if(signed(p)<0)p.reverse();const out=[];let guard=0;
 while(p.length>3&&guard++<1000){let found=false;for(let i=0;i<p.length;i++){
  const a=p[(i+p.length-1)%p.length],b=p[i],c=p[(i+1)%p.length];if(cross(a,b,c)<=1e-8)continue;
  if(p.some(v=>v!==a&&v!==b&&v!==c&&cross(a,b,v)>=0&&cross(b,c,v)>=0&&cross(c,a,v)>=0))continue;
  out.push([a,b,c]);p.splice(i,1);found=true;break;
 }if(!found)throw Error('Use a simple polygon without crossing edges.');}
 if(p.length===3)out.push(p);return out;
}
function clip(subject,clipper){let result=subject;for(let i=0;i<clipper.length;i++){
 const a=clipper[i],b=clipper[(i+1)%clipper.length],input=result;result=[];if(!input.length)break;
 for(let j=0;j<input.length;j++){const p=input[j],q=input[(j+1)%input.length],cp=cross(a,b,p),cq=cross(a,b,q);
  if(cp>=0)result.push(p);if((cp>=0)!==(cq>=0)){const t=cp/(cp-cq);result.push([p[0]+t*(q[0]-p[0]),p[1]+t*(q[1]-p[1])]);}
 }}return result;}
function intersection(a,b){const result=[];for(const x of triangles(a))for(const y of triangles(b)){const p=clip(x,y);if(p.length>=3&&area(p)>0.001)result.push(p)}return result;}
function clashes(model){const out=[];for(let i=0;i<model.activities.length;i++)for(let j=i+1;j<model.activities.length;j++){
 const a=model.activities[i],b=model.activities[j],start=a.start>b.start?a.start:b.start,finish=a.finish<b.finish?a.finish:b.finish;
 if(start>finish)continue;const fa=model.footprints.find(f=>f.id===a.footprint),fb=model.footprints.find(f=>f.id===b.footprint);if(!fa||!fb)continue;
 const polygons=intersection(fa.points,fb.points);if(polygons.length)out.push({a,b,start,finish,days:Math.round((Date.parse(finish)-Date.parse(start))/DAY)+1,polygons});
 }return out;}
function validPolygon(points){
 if(!Array.isArray(points)||points.length<3||points.length>100||points.some(p=>!Array.isArray(p)||p.length!==2||p.some(v=>!Number.isFinite(v)||v<0||v>1000)))return false;
 if(area(points)<10)return false;
 for(let i=0;i<points.length;i++)for(let j=i+1;j<points.length;j++){
  if(j===i+1||(i===0&&j===points.length-1))continue;
  const a=points[i],b=points[(i+1)%points.length],c=points[j],d=points[(j+1)%points.length];
  if(cross(a,b,c)*cross(a,b,d)<=0&&cross(c,d,a)*cross(c,d,b)<=0&&Math.max(a[0],b[0])>=Math.min(c[0],d[0])&&Math.max(c[0],d[0])>=Math.min(a[0],b[0])&&Math.max(a[1],b[1])>=Math.min(c[1],d[1])&&Math.max(c[1],d[1])>=Math.min(a[1],b[1]))return false;
 }try{triangles(points);return true}catch{return false}
}
function validateRows(rows,footprints){
 if(!rows.length||rows.length>500)throw Error('Import between 1 and 500 activities.');const ids=new Set();
 return rows.map((r,i)=>{const id=String(r.activity_id??'').trim(),name=String(r.name??'').trim(),footprint=String(r.footprint_id??'').trim(),start=String(r.start??'').slice(0,10),finish=String(r.finish??'').slice(0,10);
 const valid=s=>/^\d{4}-\d{2}-\d{2}$/.test(s)&&Number.isFinite(Date.parse(s))&&new Date(s).toISOString().slice(0,10)===s;
 if(!/^[A-Za-z0-9_.-]+$/.test(id)||ids.has(id)||!name||!valid(start)||!valid(finish)||start>finish||!footprints.some(f=>f.id===footprint))throw Error(`Row ${i+2}: use a unique activity_id, name, valid YYYY-MM-DD dates and an existing footprint_id.`);
 ids.add(id);return {id,name,footprint,start,finish};});
}
function parseCSV(text){const rows=[];let row=[],value='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){value+='"';i++}else quoted=!quoted;}else if(c===','&&!quoted){row.push(value);value=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(value);if(row.some(v=>v.trim()))rows.push(row);row=[];value=''}else value+=c;}if(quoted)throw Error('Unclosed quotation in CSV.');row.push(value);if(row.some(v=>v.trim()))rows.push(row);const headers=(rows.shift()||[]).map(h=>h.replace(/^\uFEFF/,'').trim().toLowerCase());return rows.map(r=>Object.fromEntries(headers.map((h,i)=>[h,r[i]??''])));}

const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let model=seed();try{const v=JSON.parse(localStorage.getItem('kfm-demo'));if(v?.footprints?.length&&v?.activities?.length)model=v;}catch{}
let selected=model.footprints[0].id,cursor='2027-02-15',drawing=false,points=[],playing=null,tab='footprints',zoom=1;
const save=()=>{try{localStorage.setItem('kfm-demo',JSON.stringify(model));}catch{toast('Browser storage is unavailable. Export your workspace to keep changes.');}};
const fmt=s=>new Date(s+'T00:00:00Z').toLocaleDateString('en-AU',{day:'numeric',month:'short',timeZone:'UTC'});
function toast(s){$('#toast').textContent=s;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),4000)}
const icon=(name)=>({map:'◇',layers:'▱',time:'◷',box:'⬡',plus:'＋',clash:'⋈',play:'▶',upload:'↥',download:'↓',search:'⌕',settings:'⚙'}[name]||name);

// Interaction bindings
$('#import').onclick=()=>showImport();$('#export').onclick=()=>{download('Brisbane-Airport.kfm.json',JSON.stringify({format:'keyframe-concept-workspace',version:1,...model},null,2));toast('Workspace exported. This is a demo format, not a native KFM file.');};
$('#open').onclick=()=>$('#workspace-file').click();$('#workspace-file').onchange=loadWorkspace;
$('#reset').onclick=()=>{if(confirm('Reset to the sample airport projects? This replaces locally saved demo data.')){model=seed();selected=model.footprints[0].id;cursor='2027-02-15';save();render();}};
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});

if($('#save-details'))$('#save-details').onclick=()=>{const name=$('#footprint-name').value.trim();if(!name)return toast('Give the footprint a name.');const updates=linked.map(a=>({...a,start:document.querySelector(`[data-start="${a.id}"]`).value,finish:document.querySelector(`[data-finish="${a.id}"]`).value}));if(updates.some(a=>!a.start||!a.finish||a.start>a.finish))return toast('Start must be on or before finish.');f.name=name;updates.forEach(a=>Object.assign(model.activities.find(b=>b.id===a.id),a));save();render();toast('Saved. Clash checks updated.');};
const begin=()=>{drawing=true;points=[];zoom=1;render()};if($('#draw'))$('#draw').onclick=begin;$('#map-draw')&&($('#map-draw').onclick=begin);
$('#map-clashes')&&($('#map-clashes').onclick=()=>{tab='clashes';render()});$('#rail-clashes').onclick=()=>{tab='clashes';render()};$('#rail-programme').onclick=()=>showImport();
$('#zoom-in').onclick=()=>{zoom=Math.min(1.8,zoom+.2);render()};$('#zoom-out').onclick=()=>{zoom=Math.max(.8,zoom-.2);render()};$('#zoom-reset').onclick=()=>{zoom=1;render()};
$('#scrub').oninput=e=>{cursor=date(+e.target.value);render()};$('#play').onclick=()=>{if(playing){clearInterval(playing);playing=null;}else{playing=setInterval(()=>{let d=day(cursor)+1;cursor=date(d>34?0:d);render()},700);}render()};
if(drawing){$('#map').onclick=e=>{const svg=$('#map'),pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const q=pt.matrixTransform($('#map-content').getScreenCTM().inverse());points.push([Math.round(q.x),Math.round(q.y)]);render()};$('#cancel-draw').onclick=()=>{drawing=false;points=[];render()};$('#undo-point').onclick=()=>{points.pop();render()};$('#finish-draw').onclick=finishDrawing;}

function modal(content){const d=document.createElement('dialog');d.innerHTML=content;document.body.append(d);d.showModal();d.addEventListener('close',()=>d.remove());d.querySelector('[data-close]')?.addEventListener('click',()=>d.close());return d;}
function finishDrawing(){if(!validPolygon(points))return toast('Use at least three vertices, with no crossing edges or duplicate points.');const d=modal(`<div class="modal-eyebrow">NEW PROJECT FOOTPRINT</div><h2>Give this space a name.</h2><p>Save a footprint, then link its ID to a programme activity.</p><label>Footprint name<input id="new-name" placeholder="e.g. Eastern apron works" autofocus></label><div class="modal-actions"><button data-close>Cancel</button><button class="primary" id="confirm-footprint">Save footprint</button></div>`);$('#confirm-footprint').onclick=()=>{const name=$('#new-name').value.trim();if(!name)return;let n=1;while(model.footprints.some(f=>f.id===`FP-${String(n).padStart(3,'0')}`))n++;const id=`FP-${String(n).padStart(3,'0')}`;model.footprints.push({id,name,color:'#8b6bd6',points:[...points]});selected=id;drawing=false;points=[];tab='footprints';save();d.close();render();toast(`${id} saved. Link this ID in your programme.`);};}
function showImport(){const d=modal(`<div class="modal-eyebrow">CONNECT SPACE + TIME</div><h2>Link your programme.</h2><p>Import a CSV programme. Each activity links to a saved footprint using its unique ID. For Excel workbooks, run the Python server version.</p><div class="import-example"><code>activity_id, name, start, finish, footprint_id</code><small>Dates: YYYY-MM-DD · Excel: first worksheet · Inclusive finish dates</small></div><div class="import-warning">Import replaces the current programme. Saved footprints are kept. All rows are checked before anything changes.</div><div class="modal-actions"><button id="template">↓ Sample CSV</button><button data-close>Cancel</button><button class="primary" id="choose-programme">Choose CSV / Excel</button></div><div id="import-error" role="alert"></div>`);$('#template').onclick=()=>download('BNE-programme-template.csv',csv([['activity_id','name','start','finish','footprint_id'],...seed().activities.map(a=>[a.id,a.name,a.start,a.finish,a.footprint])]),'text/csv');$('#choose-programme').onclick=()=>$('#programme-file').click();$('#programme-file').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>5e6)throw Error('Use a file smaller than 5 MB.');let rows;if(file.name.toLowerCase().endsWith('.xlsx')){throw Error('Excel import needs the Python server. Save your workbook as CSV for this offline demo, or run server.py and open the server version.');}else rows=parseCSV(await file.text());const activities=validateRows(rows,model.footprints);model.activities=activities;model.source=file.name;save();d.close();render();toast(`${activities.length} activities linked. Clash checks updated.`);}catch(err){$('#import-error').textContent=err.message;}e.target.value='';};}
async function loadWorkspace(e){try{const file=e.target.files[0];if(!file)return;if(file.size>5e6)throw Error('Workspace too large.');const v=JSON.parse(await file.text());if(v.format!=='keyframe-concept-workspace'||v.version!==1||!Array.isArray(v.footprints)||!v.footprints.length||v.footprints.length>100)throw Error('Choose an exported demo workspace.');const ids=new Set();for(const f of v.footprints){if(typeof f.id!=='string'||!/^[A-Za-z0-9_-]+$/.test(f.id)||ids.has(f.id)||typeof f.name!=='string'||!/^#[0-9a-f]{6}$/i.test(f.color)||!validPolygon(f.points))throw Error('Invalid footprint in workspace.');ids.add(f.id);}const activities=validateRows(v.activities.map(a=>({activity_id:a.id,name:a.name,start:a.start,finish:a.finish,footprint_id:a.footprint})),v.footprints);model={footprints:v.footprints,activities,source:typeof v.source==='string'?v.source:undefined};selected=model.footprints[0].id;save();render();toast('Workspace restored.');}catch(err){toast(err.message)}}
render();
